[project]
name = "pwnchecker"
version = "0.1.0"
description = "PwnChecker: local-first breach checker with encrypted storage."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ths1959" }]
dependencies = [
  "typer>=0.12",
  "PySide6>=6.7",
  "platformdirs>=4.2",
  "cryptography>=42.0",
  "argon2-cffi>=23.1",
]

[project.scripts]
pwnchecker = "pwnchecker.cli:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-qt>=4.4",
  "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
